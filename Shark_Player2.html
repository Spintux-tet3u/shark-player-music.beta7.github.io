        --bg: #0a0a0a;
        --fg: #fff;
        --ac: #ff2a1f;
        --ga: rgba(255, 255, 255, 0.17);
        --gb: rgba(255, 255, 255, 0.04);
        --edge: rgba(255, 255, 255, 0.45);
        --shade: rgba(0, 0, 0, 0.35);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Sora",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow-x: hidden;
        transition:
          background 0.4s,
          color 0.4s;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        opacity: 0.6;
        z-index: 0;
        pointer-events: none;
        will-change: transform;
        background: radial-gradient(circle, var(--blob, var(--ac)) 0%, transparent 68%);
      }
      body::before {
        width: 480px;
        height: 480px;
        top: -170px;
        right: -170px;
      }
      body::after {
        width: 420px;
        height: 420px;
        bottom: 10px;
        left: -190px;
        opacity: 0.4;
      }
      .app {
        position: relative;
        z-index: 1;
        max-width: 480px;

      addL("ab_h", ["Why Shark Player exists", "Por qué existe Shark Player", "Por que o Shark Player existe", "Porque é que o Shark Player existe", "Зачем нужен Shark Player"]);
      addL("ab_p1", ["I wanted a customizable player with Liquid Glass and blur that doesn’t encourage piracy. I figured other people felt the same way, so I decided to build it.", "Quería un reproductor personalizable, con Liquid Glass y blur, que no incentivara la piratería. Pensé que más gente pensaba como yo, así que decidí crearlo.", "Eu queria um player personalizável, com Liquid Glass e blur, que não incentivasse a pirataria. Achei que outras pessoas pensavam como eu, então decidi criar.", "Queria um leitor personalizável, com Liquid Glass e blur, que não incentivasse a pirataria. Achei que mais pessoas pensavam como eu, por isso decidi criá-lo.", "Я хотел настраиваемый плеер с Liquid Glass и размытием, который не поощряет пиратство. Я решил, что так думаю не один, и создал его."]);
      addL("ab_p2", ["Why no ready-made songs to click and play? Because Shark isn’t a store or a catalog: it doesn’t host or distribute music. You bring your own files and links, or use the services’ official players, and it plays everything in one place.", "¿Por qué no trae canciones listas para tocar? Porque Shark no es una tienda ni un catálogo: no aloja ni distribuye música. Tú traes tus archivos y enlaces, o usas los reproductores oficiales de los servicios, y él se encarga de reproducir todo en un solo lugar.", "Por que não vem com músicas prontas para clicar e abrir? Porque o Shark não é uma loja nem um catálogo: ele não hospeda nem distribui música. Você traz os seus arquivos e links, ou usa os players oficiais dos serviços, e ele toca tudo num só lugar.", "Porque é que não traz músicas prontas a tocar? Porque o Shark não é uma loja nem um catálogo: não aloja nem distribui música. Tu trazes os teus ficheiros e ligações, ou usas os leitores oficiais dos serviços, e ele toca tudo num só sítio.", "Почему нет готовых песен, которые можно сразу включить? Потому что Shark — не магазин и не каталог: он не хранит и не распространяет музыку. Вы приносите свои файлы и ссылки или используете официальные плееры сервисов, а он проигрывает всё в одном месте."]);
      addL("ab_p3", ["Why Liquid Glass? Because listening to music is a visual moment too. The glass, the blur and the colors make the app yours, and every value can be adjusted in settings.", "¿Por qué Liquid Glass? Porque escuchar música también es un momento visual. El cristal, el blur y los colores hacen que la app sea tuya, y todos los valores se pueden ajustar en los ajustes.", "Por que Liquid Glass? Porque ouvir música também é um momento visual. O vidro, o blur e as cores deixam o app com a sua cara, e todos os valores podem ser ajustados nas configurações.", "Porquê Liquid Glass? Porque ouvir música também é um momento visual. O vidro, o blur e as cores tornam a app tua, e todos os valores podem ser ajustados nas definições.", "Почему Liquid Glass? Потому что слушать музыку — это ещё и визуальный момент. Стекло, размытие и цвета делают приложение вашим, а все значения можно менять в настройках."]);

      addL("ab_cn", ["(This is just one AI’s opinion, one more point of view. If you want to draw conclusions, compare with other sources and reach your own.)", "(Es solo la opinión de una IA, un punto de vista más. Si vas a sacar conclusiones, compáralo con otras fuentes y saca las tuyas.)", "(É só a opinião de uma IA, um ponto de vista a mais. Se for tirar conclusões, compare com outras fontes e tire as suas.)", "(É só a opinião de uma IA, mais um ponto de vista. Se fores tirar conclusões, compara com outras fontes e tira as tuas.)", "(Это лишь мнение одного ИИ, ещё одна точка зрения. Если хотите делать выводы, сравните с другими источниками и сделайте свои.)"]);
      addL("ab_c1", ["Real customization: themes, accent color, adjustable glass blur and refraction, logo shapes, ready-made modes and modes you save yourself. You can make the player yours without touching code.", "Personalización de verdad: temas, color de acento, cristal con blur y refracción ajustables, formas de logo, modos listos y modos que guardas tú. Puedes dejar el reproductor a tu gusto sin tocar código.", "Personalização de verdade: temas, cor de destaque, vidro com blur e refração ajustáveis, formas de logo, modos prontos e modos que você mesmo salva. Dá para deixar o player com a sua cara sem mexer em código.", "Personalização a sério: temas, cor de destaque, vidro com blur e refração ajustáveis, formas de logótipo, modos prontos e modos que guardas tu. Podes deixar o leitor à tua maneira sem mexer em código.", "Настоящая персонализация: темы, акцентный цвет, настраиваемые размытие и преломление стекла, формы логотипа, готовые режимы и режимы, которые вы сохраняете сами. Плеер можно сделать своим, не трогая код."]);
      addL("ab_c2", ["Everything in one place: files from your device (with embedded covers and tags), YouTube, Spotify, SoundCloud, Deezer, Mixcloud, Internet Archive and direct links all go into the same queue.", "Todo en un solo lugar: archivos de tu dispositivo (con portada y datos incrustados), YouTube, Spotify, SoundCloud, Deezer, Mixcloud, Internet Archive y enlaces directos entran en la misma cola.", "Tudo num lugar só: arquivos do seu aparelho (com capa e dados embutidos), YouTube, Spotify, SoundCloud, Deezer, Mixcloud, Internet Archive e links diretos entram na mesma fila.", "Tudo num só sítio: ficheiros do teu dispositivo (com capa e dados incorporados), YouTube, Spotify, SoundCloud, Deezer, Mixcloud, Internet Archive e ligações diretas entram na mesma fila.", "Всё в одном месте: файлы с устройства (со встроенными обложками и тегами), YouTube, Spotify, SoundCloud, Deezer, Mixcloud, Internet Archive и прямые ссылки попадают в одну очередь."]);
      addL("ab_c3", ["Details that matter: a draggable video window, floating lyrics, synced lyrics, keyboard shortcuts and installing it as an app.", "Detalles que marcan la diferencia: ventana de vídeo arrastrable, letra flotante, letras sincronizadas, atajos de teclado e instalación como app.", "Detalhes que fazem diferença: janela do vídeo arrastável, letra flutuante, letras sincronizadas, atalhos de teclado e instalação como app.", "Pormenores que fazem diferença: janela de vídeo arrastável, letra flutuante, letras sincronizadas, atalhos de teclado e instalação como app.", "Приятные мелочи: перетаскиваемое окно видео, плавающий текст песни, синхронизированные тексты, горячие клавиши и установка как приложения."]);
      addL("ab_c4", ["Respect for the user: whatever leaves the browser (like cover lookups) is disclosed and can be turned off, and the app simplifies itself if the device is struggling.", "Respeto por el usuario: lo que sale del navegador (como la búsqueda de portadas) se avisa y se puede desactivar, y la app se simplifica sola si el dispositivo va justo.", "Respeito ao usuário: o que sai do navegador (como a busca de capas) é avisado e dá para desligar, e o app se simplifica sozinho se o aparelho estiver pesado.", "Respeito pelo utilizador: o que sai do navegador (como a pesquisa de capas) é avisado e pode ser desligado, e a app simplifica-se sozinha se o dispositivo estiver pesado.", "Уважение к пользователю: всё, что уходит из браузера (например, поиск обложек), показывается заранее и отключается, а приложение само упрощается, если устройство не справляется."]);

      function wpRender() {

      function wpShrink(f) {

      function capMap(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const x = c.getContext("2d"),
          im = x.createImageData(w, h),
          d = im.data,
          r = h / 2,
          R = r * 0.6;
        for (let j = 0; j < h; j++)
          for (let i = 0; i < w; i++) {
            const px = i + 0.5,
              py = j + 0.5,
              cx = Math.min(Math.max(px, r), w - r),
              dx = px - cx,
              dy = py - r,
              dist = Math.hypot(dx, dy),
              depth = r - dist;
            let mx = 0,
              my = 0;
            if (depth < R && dist > 0.001) {
              const m = Math.pow(1 - Math.max(depth, 0) / R, 2.6);
              mx = (-dx / dist) * m;
              my = (-dy / dist) * m;
            }
            const k = (j * w + i) * 4;
            d[k] = 127.5 + mx * 127;
            d[k + 1] = 127.5 + my * 127;
            d[k + 2] = 128;
            d[k + 3] = 255;
          }
        x.putImageData(im, 0, 0);
        return c.toDataURL("image/png");
      }
      if (document.documentElement.classList.contains("refract"))
        try {
          [
            ["liq-nav", 256, 48],

          ].forEach((a) => {

            if (f) f.setAttribute("href", capMap(a[1], a[2]));
          });

        }

      (function () {
        let t = 0,

      // ---- v2: custom modes, logo shapes, movable video window, floating lyrics ----
      var LGS = {

      function modeVals(m) {

      function lgPoly(k) {
        const v = typeof LGS === "undefined" ? 0 : LGS[k];
        if (!v) return "";
        if (typeof v === "string") return v;
        const n = v[0],
          a = v[1],
          p = [];
        for (let i = 0; i < 180; i++) {
          const t = (i / 180) * 2 * Math.PI,
            r = (50 * (1 + a * Math.cos(n * t))) / (1 + a);
          p.push((50 + r * Math.sin(t)).toFixed(2) + "% " + (50 - r * Math.cos(t)).toFixed(2) + "%");
        }
        return "polygon(" + p.join(", ") + ")";
      }
      function applyLogo() {
        if (typeof LGS === "undefined") return;
        const h = document.documentElement,
          k = LGS.hasOwnProperty(S.lgs) ? S.lgs : "";
        if (k) h.dataset.lgs = k;
        else delete h.dataset.lgs;

      function lgRender() {
        const d = L[S.lang] || L.en,
          b = $("lgs");
        b.innerHTML = "";
        ["", ...Object.keys(LGS)].forEach((k) => {

      function cmSave() {
        const d = L[S.lang] || L.en;

      function lyMini(on) {
        lyp.classList.toggle("mini", on);
        if (!on) ["left", "top", "right", "bottom", "transform"].forEach((q) => (lyp.style[q] = ""));
      }
      function lyMiniOff() {
        lyMini(false);
      }
      function mkDrag(el, grip, gate, after) {
        let sx = 0,
          sy = 0,
          ox = 0,
          oy = 0,
          on = false;
        grip.addEventListener("pointerdown", (e) => {
          if (!gate() || e.target.closest("button")) return;
          const r = el.getBoundingClientRect();
          sx = e.clientX;
          sy = e.clientY;
          ox = r.left;
          oy = r.top;
          on = true;
          grip.setPointerCapture(e.pointerId);
          e.preventDefault();
        });
        grip.addEventListener("pointermove", (e) => {
          if (!on) return;
          const r = el.getBoundingClientRect();
          el.style.left = Math.min(Math.max(ox + e.clientX - sx, 0), Math.max(0, innerWidth - r.width)) + "px";
          el.style.top = Math.min(Math.max(oy + e.clientY - sy, 0), Math.max(0, innerHeight - r.height)) + "px";
          el.style.right = "auto";
          el.style.bottom = "auto";
          el.style.transform = "none";
          if (after) after();
        });
        const end = () => (on = false);
        grip.addEventListener("pointerup", end);
        grip.addEventListener("pointercancel", end);
      }
      function keepIn(el) {
        if (!el.style.left && !el.style.top) return;

        el.style.left = Math.min(Math.max(r.left, 0), Math.max(0, innerWidth - r.width)) + "px";
        el.style.top = Math.min(Math.max(r.top, 0), Math.max(0, innerHeight - r.height)) + "px";
        el.style.right = "auto";
        el.style.bottom = "auto";

      function embPlace() {
        const r = EW.getBoundingClientRect();

      mkDrag(EW, eh, () => document.body.classList.contains("showemb"), embPlace);

      setInterval(() => document.body.classList.contains("showemb") && embPlace(), 400);
      // floating lyrics
      mkDrag(lyp, lyp.querySelector(".lhd"), () => lyp.classList.contains("mini"), null);
      $("lmin").onclick = () => lyMini(true);

      $("cmname").onkeydown = (e) => {
        if (e.key === "Enter") cmSave();
      };
      addEventListener("resize", () => {
        keepIn(EW);
        keepIn(lyp);

      });
      applyLogo();
      embPlace();
      uiRefresh();
    </script>
    <script>

      addEventListener("keydown", function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var t = e.target,
          tag = t && t.tagName,
          g = function (i) {
            return document.getElementById(i);
          };
        if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && t.type !== "range")) return;
        var k = e.key;
        if (k === " " && tag !== "BUTTON" && tag !== "INPUT") {
          e.preventDefault();
          g("pp").click();
        } else if (e.shiftKey && k === "ArrowRight") {
          g("nxt").click();
        } else if (e.shiftKey && k === "ArrowLeft") {

        } else if (!e.shiftKey && tag !== "INPUT" && (k === "ArrowRight" || k === "ArrowLeft")) {
          seekBy(k === "ArrowRight" ? 5 : -5);
        }
      });

      (function () {
        function probe() {
          var f = [],
            l = 0;
          function t(n) {
            if (l && n - l < 250) f.push(n - l);
            l = n;
            if (f.length < 70) requestAnimationFrame(t);
            else {
              var a =
                f.reduce(function (x, y) {
                  return x + y;
                }, 0) / f.length;
              if (a > 30) {
                var c = document.documentElement.classList;
                c.add("lite");
                c.remove("refract");
              }
            }
          }
          requestAnimationFrame(t);
        }
        setTimeout(probe, 2500);
        setTimeout(function () {
          if (!document.documentElement.classList.contains("lite")) probe();
        }, 15000);
      })();
